name: GitHub Pages

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  relay-python:
    name: Test relay Python
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Test isolated UDP forwarding and diagnostics
        working-directory: assets/downloads/vpn-relay
        run: python -B -m unittest discover -s tests -v
      - name: Verify downloadable kit matches reviewed source
        working-directory: assets/downloads/vpn-relay
        run: |
          sha256sum --check SHA256SUMS
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          files = [line.split("  ", 1)[1] for line in Path("SHA256SUMS").read_text().splitlines()]
          files.append("SHA256SUMS")
          with ZipFile("vpn-relay-kit.zip") as archive:
              assert set(archive.namelist()) == {"vpn-relay/" + name for name in files}
              for name in files:
                  assert archive.read("vpn-relay/" + name) == Path(name).read_bytes(), name
          print("Downloadable ZIP matches the source and checksum manifest.")
          PY

  relay-powershell:
    name: Validate Windows relay
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell 5.1 syntax, config, and firewall scope
        shell: powershell
        working-directory: assets/downloads/vpn-relay
        run: .\tests\validate-powershell.ps1

  build:
    name: Build site
    needs: [relay-python, relay-powershell]
    # Ruby 3.4.4 has a prebuilt binary for 24.04, but not 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      JEKYLL_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.4"
          bundler-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Build site
        run: npm run jekyll:build

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
